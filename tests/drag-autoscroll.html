<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../dist/sidebar/sidebar.css">
  <style>
    body { width: 300px; }
    #tabs-list { display: block; }
    .tab-row { height: 38px; }
    .tab-button { width: 100%; height: 100%; }
    #result { position: fixed; top: 0; right: 0; z-index: 20; background: white; color: black; }
  </style>
</head>
<body>
  <output id="result">RUNNING</output>
  <div id="actions">
    <input class="search-input" aria-label="Search tabs and bookmarks" placeholder="search tabs and bookmarks">
  </div>
  <main id="sidebar-content">
    <ul id="tabs-list"></ul>
    <ul id="groups-list"></ul>
    <ul id="bookmarks-list"></ul>
  </main>
  <div id="settings">
    <div class="action-panel"></div>
    <div class="footer-controls">
      <div class="action-controls">
        <button class="control">▦</button><button class="control">☆</button>
        <button class="control">▣</button><button class="control">☑</button>
      </div>
      <button class="control settings-btn">settings</button>
    </div>
  </div>
  <script>
    addEventListener('error', (event) => {
      document.getElementById('result').textContent = `FAIL: ${event.error?.stack ?? event.message} (${event.filename}:${event.lineno})`;
    });
    addEventListener('unhandledrejection', (event) => {
      document.getElementById('result').textContent = `FAIL: ${event.reason}`;
    });
  </script>
  <script type="module">
    globalThis.chrome = { tabGroups: { TAB_GROUP_ID_NONE: -1 } };
    // Step frames explicitly so the pointer remains over a valid row while the
    // browser performs real scrolling and hit testing.
    const frames = [];
    globalThis.requestAnimationFrame = (callback) => { frames.push(callback); return frames.length; };
    globalThis.cancelAnimationFrame = () => {};
    const { makeTabDraggable, setupSidebarDropZones } = await import('../dist/sidebar/helpers/dragAndDrop.js');
    const list = document.getElementById('tabs-list');
    for (let id = 1; id <= 45; id++) {
      const item = document.createElement('li');
      item.className = 'tab-item';
      item.dataset.tabId = String(id);
      const row = document.createElement('div');
      row.className = 'tab-row';
      const button = document.createElement('button');
      button.className = 'tab-button';
      button.textContent = `Tab ${id}`;
      row.append(button);
      item.append(row);
      list.append(item);
      makeTabDraggable(button, row, 1, id, () => true, () => {});
    }
    setupSidebarDropZones(list, document.getElementById('groups-list'), 1, () => true, () => {});
    const content = document.getElementById('sidebar-content');
    const header = document.getElementById('actions');
    const footer = document.getElementById('settings');
    const settingsButton = footer.querySelector('.settings-btn');
    const actionControls = footer.querySelector('.action-controls');
    const footerControls = footer.querySelector('.footer-controls');
    const searchHeight = header.querySelector('.search-input').getBoundingClientRect().height;
    const controlsMatchSearch = [...actionControls.querySelectorAll('button'), settingsButton]
      .every((button) => button.getBoundingClientRect().height === searchHeight);
    const actionButtons = [...actionControls.querySelectorAll('button')];
    const firstAction = actionButtons[0].getBoundingClientRect();
    const lastAction = actionButtons.at(-1).getBoundingClientRect();
    const controlsRect = footerControls.getBoundingClientRect();
    const controlsFillSidebar = actionButtons.length === 4 &&
      firstAction.left === controlsRect.left && settingsButton.getBoundingClientRect().right === controlsRect.right &&
      actionButtons.every((button) => {
        const rect = button.getBoundingClientRect();
        return rect.top === firstAction.top && Math.abs(rect.width - firstAction.width) < 1;
      }) && settingsButton.getBoundingClientRect().top === firstAction.top &&
      lastAction.right < settingsButton.getBoundingClientRect().left;
    const headerTop = header.getBoundingClientRect().top;
    const searchBottom = header.querySelector('.search-input').getBoundingClientRect().bottom;
    const headerBottom = header.getBoundingClientRect().bottom;
    const footerBottom = footer.getBoundingClientRect().bottom;
    const settingsButtonBottom = settingsButton.getBoundingClientRect().bottom;
    const edgeClearance = headerTop >= 7 && headerTop <= 10 &&
      headerBottom - searchBottom >= 7 &&
      actionControls.getBoundingClientRect().top > content.getBoundingClientRect().bottom &&
      actionControls.getBoundingClientRect().bottom === settingsButton.getBoundingClientRect().bottom &&
      innerHeight - footerBottom >= 7 &&
      innerHeight - settingsButtonBottom >= 11 &&
      innerHeight - settingsButtonBottom <= 14;
    const source = list.querySelector('.tab-button');
    source.dispatchEvent(new DragEvent('dragstart', {
      bubbles: true, dataTransfer: new DataTransfer(), clientX: 60,
      clientY: source.getBoundingClientRect().top + 10,
    }));
    const pointerY = content.getBoundingClientRect().bottom - 12;
    const pointerX = 80;
    const initial = document.elementFromPoint(pointerX, pointerY);
    if (!initial) throw new Error(`no hit at ${pointerX},${pointerY}; content=${JSON.stringify(content.getBoundingClientRect().toJSON())}; viewport=${innerWidth}x${innerHeight}`);
    initial.dispatchEvent(new DragEvent('dragover', {
      bubbles: true, dataTransfer: new DataTransfer(), clientX: pointerX, clientY: pointerY,
    }));
    const firstMarked = document.querySelector('.drop-before, .drop-after');
    for (let frame = 0; frame < 8; frame++) frames.shift()?.();
    const underPointer = document.elementFromPoint(pointerX, pointerY)?.closest('.tab-row');
    const marked = document.querySelector('.drop-before, .drop-after');
    const scrollsBetweenBars = content.scrollTop > 0 &&
      document.scrollingElement.scrollTop === 0 &&
      header.getBoundingClientRect().top === headerTop &&
      footer.getBoundingClientRect().bottom === footerBottom;
    const panel = document.createElement('div');
    panel.className = 'setting-info-section';
    for (let item = 0; item < 40; item++) {
      const line = document.createElement('p');
      line.textContent = `Setting ${item}`;
      panel.append(line);
    }
    footer.insertBefore(panel, footerControls);
    const settingsScrolls = panel.scrollHeight > panel.clientHeight &&
      settingsButton.getBoundingClientRect().bottom === settingsButtonBottom;
    const passed = controlsMatchSearch && controlsFillSidebar && edgeClearance && scrollsBetweenBars && settingsScrolls &&
      underPointer && marked === underPointer && marked !== firstMarked;
    document.getElementById('result').textContent = passed
      ? 'PASS' : `FAIL: heights=${controlsMatchSearch} (${searchHeight}, ${[...actionControls.querySelectorAll('button'), settingsButton].map((button) => button.getBoundingClientRect().height)}), widths=${controlsFillSidebar}, edges=${edgeClearance} (${headerTop}, ${headerBottom - searchBottom}, ${innerHeight - footerBottom}, ${innerHeight - settingsButtonBottom}), scroll=${content.scrollTop}, bars=${scrollsBetweenBars}, settings=${settingsScrolls} (${panel.scrollHeight}, ${panel.clientHeight}, ${settingsButton.getBoundingClientRect().bottom - settingsButtonBottom}), marker=${marked?.textContent}, under=${underPointer?.textContent}`;
  </script>
</body>
</html>
