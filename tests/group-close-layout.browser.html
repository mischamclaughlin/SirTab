<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../dist/sidebar/sidebar.css">
  <style>body { width: 300px; }</style>
</head>
<body>
  <main id="sidebar-content">
    <ul id="tabs-list"></ul>
    <ul id="groups-list"></ul>
    <ul id="bookmarks-list"></ul>
  </main>
  <output id="result">RUNNING</output>
  <script type="module">
    try {
      globalThis.chrome = {
        runtime: { getURL: (path) => path },
        tabGroups: { TAB_GROUP_ID_NONE: -1 },
      };
      const { cycleTabs } = await import('../dist/sidebar/tab/tab.js');
      const { buildGroup } = await import('../dist/sidebar/group/group.js');
      const ungrouped = { id: 1, title: 'Ungrouped tab', url: 'https://example.com' };
      const grouped = { id: 2, groupId: 21, title: 'A grouped tab with a very long title', url: 'https://example.com' };
      cycleTabs(document.getElementById('tabs-list'), [ungrouped]);
      buildGroup(true, [{ id: 21, title: 'Projects', color: 'blue' }],
        new Map([[21, [grouped]]]), new Set(), false, '',
        document.getElementById('groups-list'), 1, () => {}, false);

      const looseClose = document.querySelector('#tabs-list .row-delete-btn');
      const groupClose = document.querySelector('.tree-row .row-delete-btn');
      const groupedClose = document.querySelector('.group-tabs .row-delete-btn');
      const groupTabs = document.querySelector('.group-tabs');
      const groupedRow = groupTabs.querySelector('.tab-row');
      const groupedLabel = groupedRow.querySelector('.tab-label');
      const plusButton = document.querySelector('.row-add-btn');
      const plus = document.querySelector('.row-add-btn svg');
      const closeIcons = [looseClose, groupClose, groupedClose].map((button) =>
        button.querySelector('svg.control-icon'));
      const colouredArea = getComputedStyle(groupTabs, '::before');
      const ends = [looseClose, groupClose, groupedClose].map((button) =>
        button.getBoundingClientRect().right);
      const expectedFillEnd = groupTabs.getBoundingClientRect().right -
        groupedClose.getBoundingClientRect().width -
        parseFloat(getComputedStyle(groupedRow).columnGap);
      const fillWidth = groupTabs.getBoundingClientRect().width -
        groupedClose.getBoundingClientRect().width -
        parseFloat(getComputedStyle(groupedRow).columnGap);
      if (ends.some((end) => Math.abs(end - ends[0]) > 0.5) ||
          closeIcons.some((icon) => !icon || icon.getBoundingClientRect().width !== plus.getBoundingClientRect().width) ||
          expectedFillEnd >= groupedClose.getBoundingClientRect().left ||
          colouredArea.right !== '28px' ||
          colouredArea.borderTopRightRadius !== '4px' ||
          Math.abs(expectedFillEnd - groupedLabel.getBoundingClientRect().right - 4) > 0.5 ||
          Math.abs(fillWidth - (expectedFillEnd - groupTabs.getBoundingClientRect().left)) > 0.5 ||
          getComputedStyle(groupedClose).color !== getComputedStyle(looseClose).color ||
          getComputedStyle(plusButton).color !== getComputedStyle(groupClose).color ||
          getComputedStyle(plusButton).borderColor !== getComputedStyle(groupClose).borderColor) {
        throw new Error('group close buttons are misaligned or inside the coloured area');
      }
      document.body.style.width = '180px';
      document.body.style.height = '180px';
      for (let index = 0; index < 40; index++) {
        groupTabs.append(groupTabs.firstElementChild.cloneNode(true));
      }
      const groupList = document.getElementById('groups-list');
      const sidebar = document.getElementById('sidebar-content');
      const narrowClose = groupedClose.getBoundingClientRect();
      const narrowGroup = groupTabs.getBoundingClientRect();
      const narrowFillEnd = narrowGroup.right - 28;
      if (sidebar.scrollHeight <= sidebar.clientHeight ||
          Math.abs(narrowFillEnd - groupedLabel.getBoundingClientRect().right - 4) > 0.5 ||
          narrowClose.width !== looseClose.getBoundingClientRect().width ||
          narrowClose.width !== 24 ||
          narrowClose.right > groupList.getBoundingClientRect().right + 0.5 ||
          narrowGroup.right > groupList.getBoundingClientRect().right + 0.5) {
        throw new Error(`narrow open group clipped: ${JSON.stringify({
          close: narrowClose.toJSON(), group: narrowGroup.toJSON(),
          list: groupList.getBoundingClientRect().toJSON(),
        })}`);
      }
      document.getElementById('result').textContent = 'PASS';
    } catch (error) {
      document.getElementById('result').textContent = `FAIL: ${error.message}`;
    }
  </script>
</body>
</html>
