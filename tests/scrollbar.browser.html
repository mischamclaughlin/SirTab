<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../dist/sidebar/sidebar.css">
</head>
<body>
  <output id="result">RUNNING</output>
  <main id="sidebar-content"></main>
  <div id="settings">
    <div class="action-panel"></div>
    <div class="setting-info-section"></div>
  </div>
  <script type="module">
    try {
      const { setupAutoHideScrollbars } = await import('../dist/sidebar/helpers/scrollbar.js');
      setupAutoHideScrollbars();
      const sidebar = document.getElementById('sidebar-content');
      const tabs = document.createElement('ul');
      tabs.id = 'tabs-list';
      const row = document.createElement('li');
      row.className = 'tab-item';
      const tabRow = document.createElement('div');
      tabRow.className = 'tab-row';
      tabRow.style.height = '24px';
      row.append(tabRow);
      tabs.append(row);
      sidebar.append(tabs);
      const widthWithoutScrollbar = tabRow.getBoundingClientRect().width;
      for (let index = 0; index < 80; index++) {
        tabs.append(row.cloneNode(true));
      }
      if (sidebar.scrollHeight <= sidebar.clientHeight) {
        throw new Error('tab list did not overflow');
      }
      const widthWithScrollbar = tabRow.getBoundingClientRect().width;
      if (Math.abs(widthWithoutScrollbar - widthWithScrollbar) > 0.5) {
        throw new Error(`scrollbar changed tab width: ${widthWithoutScrollbar} to ${widthWithScrollbar}`);
      }
      const areas = [
        document.getElementById('sidebar-content'),
        document.querySelector('#settings > .action-panel'),
        document.querySelector('.setting-info-section'),
      ];
      const idleColour = getComputedStyle(areas[0]).scrollbarColor;
      if (areas.some((area) => getComputedStyle(area).scrollbarWidth !== 'thin')) {
        throw new Error('scrollbar is not thin');
      }
      areas.forEach((area) => area.dispatchEvent(new Event('scroll')));
      if (areas.some((area) => !area.classList.contains('is-scrolling') ||
          getComputedStyle(area).scrollbarColor === idleColour)) {
        throw new Error('scrollbar did not appear during scrolling');
      }
      await new Promise((resolve) => setTimeout(resolve, 800));
      if (areas.some((area) => area.classList.contains('is-scrolling') ||
          getComputedStyle(area).scrollbarColor !== idleColour)) {
        throw new Error('scrollbar did not become transparent after scrolling');
      }
      document.getElementById('result').textContent = 'PASS';
    } catch (error) {
      document.getElementById('result').textContent = `FAIL: ${error.message}`;
    }
  </script>
</body>
</html>
