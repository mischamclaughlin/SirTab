<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../dist/sidebar/sidebar.css">
  <style>body { width: 300px; }</style>
</head>
<body>
  <output id="result">RUNNING</output>
  <main id="sidebar-content">
    <ul id="tabs-list"></ul><ul id="groups-list"></ul><ul id="bookmarks-list"></ul>
  </main>
  <script type="module">
    try {
      const created = [];
      globalThis.chrome = {
        runtime: { getURL: path => path },
        tabGroups: { TAB_GROUP_ID_NONE: -1 },
        tabs: { get: async () => ({ id: 10, title: 'Incoming', url: 'https://incoming.example' }) },
        bookmarks: {
          get: async id => [{ id, parentId: '22', index: 0 }],
          create: async entry => { created.push(entry); },
        },
      };
      const { cycleTabs } = await import('../dist/sidebar/tab/tab.js');
      const { cycleBookmarks } = await import('../dist/sidebar/bookmark/bookmark.js');
      const { setupSidebarDropZones } = await import('../dist/sidebar/helpers/dragAndDrop.js');
      const tabs = document.getElementById('tabs-list');
      const groups = document.getElementById('groups-list');
      const bookmarks = document.getElementById('bookmarks-list');
      cycleTabs(tabs, [{ id: 10, title: 'Incoming', url: 'https://incoming.example' }], {
        windowId: 1, enableDragDrop: true, requestRender: () => {},
      });
      cycleBookmarks(bookmarks, [{ id: '22', title: 'Folder', children: [
        { id: '23', parentId: '22', title: 'First child', url: 'https://first.example' },
        { id: '24', parentId: '22', title: 'Second child', url: 'https://second.example' },
      ] }]);
      setupSidebarDropZones(tabs, groups, bookmarks, 1, () => true, () => {}, () => {});
      const source = tabs.querySelector('.tab-button');
      const nested = bookmarks.querySelector('.bookmark-nested-list');
      const first = nested.querySelector('.tab-row');
      const rect = nested.getBoundingClientRect();
      const x = rect.left + 10, y = first.getBoundingClientRect().top - 4;
      const hit = document.elementFromPoint(x, y);
      if (hit !== nested) throw Error('Expected actual nested-list padding as the drop hit target');
      function dispatch(target, type, clientX = x, clientY = y) {
        target.dispatchEvent(new DragEvent(type, {
          bubbles: true, dataTransfer: new DataTransfer(), clientX, clientY,
        }));
      }
      dispatch(source, 'dragstart');
      dispatch(hit, 'dragover');
      if (!first.classList.contains('drop-before')) throw Error('Nested-list gap should insert before its first child');
      if (bookmarks.querySelector('.tree-row').classList.contains('drop-inside')) {
        throw Error('Nested-list gap incorrectly targeted the containing folder header');
      }
      if (parseFloat(getComputedStyle(first.closest('.tab-item')).marginTop) < 10) {
        throw Error('Nested bookmark insertion marker needs visible layout space');
      }
      dispatch(document.elementFromPoint(x, y), 'drop');
      await new Promise(resolve => setTimeout(resolve, 0));
      if (created.length !== 1 || created[0].parentId !== '22' || created[0].index !== 0) {
        throw Error(`Expected insertion at child index zero: ${JSON.stringify(created)}`);
      }
      if (bookmarks.querySelector('.drop-before,.drop-inside,.drop-tab-preview') || nested.hidden) {
        throw Error('Drop should clear its marker and retain the expanded folder');
      }
      document.getElementById('result').textContent = 'PASS';
    } catch (error) {
      document.getElementById('result').textContent = `FAIL: ${error.stack}`;
    }
  </script>
</body>
</html>
