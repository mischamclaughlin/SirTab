<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../dist/sidebar/sidebar.css">
</head>
<body>
  <output id="result">RUNNING</output>
  <main id="sidebar-content">
    <ul id="tabs-list"></ul>
    <ul id="groups-list"></ul>
    <ul id="bookmarks-list"></ul>
  </main>
  <script>
    const lists = [
      document.getElementById('tabs-list'),
      document.getElementById('groups-list'),
      document.getElementById('bookmarks-list'),
    ];
    const item = (className) => {
      const node = document.createElement('li');
      node.className = className;
      return node;
    };
    const cases = [
      { name: 'empty', children: [null, null, null], lines: [0, 0], visible: [false, false, true] },
      { name: 'tabs only', children: ['tab-item', null, null], lines: [0, 0], visible: [true, false, true] },
      { name: 'groups only', children: [null, 'group-item', null], lines: [0, 0], visible: [false, true, true] },
      { name: 'bookmarks only', children: [null, null, 'tab-item'], lines: [0, 0], visible: [false, false, true] },
      { name: 'tabs and groups', children: ['tab-item', 'group-item', null], lines: [0, 0], visible: [true, true, true] },
      { name: 'tabs and bookmarks', children: ['tab-item', null, 'tab-item'], lines: [0, 0], visible: [true, false, true] },
      { name: 'groups and bookmarks', children: [null, 'group-item', 'tab-item'], lines: [0, 0], visible: [false, true, true] },
      { name: 'all sections', children: ['tab-item', 'group-item', 'tab-item'], lines: [0, 0], visible: [true, true, true] },
      { name: 'empty group result', children: ['tab-item', 'empty-search-state-message', 'tab-item'], lines: [0, 0], visible: [true, true, true] },
      { name: 'empty bookmark result', children: ['tab-item', null, 'empty-search-state-message'], lines: [0, 0], visible: [true, false, true] },
    ];
    try {
      for (const scenario of cases) {
        lists.forEach((list, index) => {
          const child = scenario.children[index] ? item(scenario.children[index]) : null;
          if (child) child.style.height = '24px';
          list.replaceChildren(...(child ? [child] : []));
        });
        const actual = lists.slice(0, 2).map((list) =>
          Number(getComputedStyle(list).borderBottomWidth !== '0px'));
        if (actual.some((width, index) => width !== scenario.lines[index])) {
          throw new Error(`${scenario.name}: expected ${scenario.lines}, got ${actual}`);
        }
        const visible = lists.map((list) => getComputedStyle(list).display !== 'none');
        if (visible.some((value, index) => value !== scenario.visible[index])) {
          throw new Error(`${scenario.name}: expected visible ${scenario.visible}, got ${visible}`);
        }
        const populated = lists.filter((list) => list.firstElementChild &&
          getComputedStyle(list).display !== 'none');
        for (let index = 1; index < populated.length; index++) {
          const gap = populated[index].firstElementChild.getBoundingClientRect().top -
            populated[index - 1].lastElementChild.getBoundingClientRect().bottom;
          if (gap !== 8) throw new Error(`${scenario.name}: section gap is ${gap}px`);
        }
        if (scenario.name === 'tabs and bookmarks') {
          const gap = lists[2].getBoundingClientRect().top - lists[0].getBoundingClientRect().bottom;
          if (gap !== 8) throw new Error(`empty groups left a ${gap}px gap`);
        }
        if (scenario.name === 'groups only') {
          const draggedTab = document.createElement('div');
          draggedTab.className = 'tab-row is-dragging';
          lists[1].firstElementChild.append(draggedTab);
          if (getComputedStyle(lists[0]).display === 'none' ||
              lists[0].getBoundingClientRect().height < 16) {
            throw new Error('empty ungrouped tab drop area did not appear during drag');
          }
          draggedTab.remove();
        }
      }
      lists.forEach((list) => list.replaceChildren());
      const tabRow = (label) => {
        const li = item('tab-item');
        const row = document.createElement('div');
        row.className = 'tab-row';
        row.style.height = '24px';
        row.textContent = label;
        li.append(row);
        return { li, row };
      };
      const first = tabRow('First tab');
      const second = tabRow('Second tab');
      const third = tabRow('Third tab');
      lists[0].append(first.li, second.li, third.li);
      const group = item('group-item');
      const groupRow = document.createElement('div');
      groupRow.className = 'tree-row';
      groupRow.style.height = '24px';
      groupRow.textContent = 'Group';
      group.append(groupRow);
      lists[1].append(group);
      const groupTop = lists[1].getBoundingClientRect().top;
      const originalGap = second.li.getBoundingClientRect().top - first.li.getBoundingClientRect().bottom;
      first.row.classList.add('drop-after');
      const openGap = second.li.getBoundingClientRect().top - first.li.getBoundingClientRect().bottom;
      if (openGap <= originalGap || lists[1].getBoundingClientRect().top !== groupTop) {
        throw new Error('tab insertion gap moved the group section');
      }
      first.row.classList.remove('drop-after');
      second.row.classList.add('drop-before');
      if (second.li.getBoundingClientRect().top - first.li.getBoundingClientRect().bottom <= originalGap ||
          lists[1].getBoundingClientRect().top !== groupTop) {
        throw new Error('before-tab gap did not open without moving groups');
      }
      second.row.classList.remove('drop-before');
      lists[0].classList.add('drop-append');
      if (lists[1].getBoundingClientRect().top !== groupTop ||
          getComputedStyle(lists[0], '::after').content === 'none') {
        throw new Error('drag append marker moved the group section');
      }
      lists[0].classList.remove('drop-append');
      second.row.classList.add('drop-before');
      document.getElementById('result').textContent = 'PASS';
    } catch (error) {
      document.getElementById('result').textContent = `FAIL: ${error.message}`;
    }
  </script>
</body>
</html>
