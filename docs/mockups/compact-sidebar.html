<div id="sir-tab-compact-mockup">
  <style>
    #sir-tab-compact-mockup {
      --sir-bg: light-dark(#f7f7fb, #1e1e2d);
      --sir-surface: light-dark(#ffffff, #2a2a3c);
      --sir-active: light-dark(#e5e8f5, #44465e);
      --sir-text: light-dark(#242538, #dedff0);
      --sir-muted: light-dark(#62647a, #a7a8bf);
      --sir-line: light-dark(#d9dbe8, #3a3b50);
      --sir-group: light-dark(#e5f0ec, #354943);
      color: var(--sir-text);
      font-family: "SF Mono", Consolas, monospace;
      display: flex;
      justify-content: center;
      padding: 0.5rem 0;
    }
    #sir-tab-compact-mockup * { box-sizing: border-box; }
    #sir-tab-compact-mockup .sir-panel {
      width: min(100%, 294px);
      min-width: 0;
      padding: 10px;
      background: var(--sir-bg);
      border: 1px solid var(--sir-line);
      border-radius: 8px;
      position: relative;
    }
    #sir-tab-compact-mockup .sir-top,
    #sir-tab-compact-mockup .sir-tools,
    #sir-tab-compact-mockup .sir-row,
    #sir-tab-compact-mockup .sir-row-main {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    #sir-tab-compact-mockup .sir-top { justify-content: space-between; gap: 8px; margin-bottom: 9px; }
    #sir-tab-compact-mockup .sir-name { font-size: 13px; font-weight: 500; }
    #sir-tab-compact-mockup .sir-density {
      font: inherit;
      color: var(--sir-muted);
      background: transparent;
      border: 1px solid var(--sir-line);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
    }
    #sir-tab-compact-mockup .sir-search {
      width: 100%;
      min-width: 0;
      padding: 7px 9px;
      color: var(--sir-text);
      background: var(--sir-surface);
      border: 1px solid var(--sir-line);
      border-radius: 4px;
      font: inherit;
      font-size: 12px;
    }
    #sir-tab-compact-mockup .sir-tools { gap: 4px; margin: 6px 0 8px; }
    #sir-tab-compact-mockup .sir-tool {
      flex: 1;
      min-height: 28px;
      color: var(--sir-muted);
      background: transparent;
      border: 1px solid var(--sir-line);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font: inherit;
      font-size: 11px;
    }
    #sir-tab-compact-mockup .sir-tool svg,
    #sir-tab-compact-mockup .sir-more svg { width: 14px; height: 14px; }
    #sir-tab-compact-mockup .sir-divider { border-top: 1px solid var(--sir-line); margin: 8px 0; }
    #sir-tab-compact-mockup .sir-heading {
      display: flex;
      justify-content: space-between;
      color: var(--sir-muted);
      font-size: 10px;
      margin: 9px 2px 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #sir-tab-compact-mockup .sir-row { gap: 3px; min-height: 30px; position: relative; }
    #sir-tab-compact-mockup .sir-row-main {
      flex: 1;
      gap: 7px;
      min-height: 28px;
      padding: 4px 5px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--sir-text);
      font: inherit;
      font-size: 11px;
      text-align: left;
    }
    #sir-tab-compact-mockup .sir-row.active .sir-row-main { background: var(--sir-active); }
    #sir-tab-compact-mockup .sir-row.group .sir-row-main { background: var(--sir-group); font-weight: 500; }
    #sir-tab-compact-mockup .sir-row.nested { padding-left: 10px; }
    #sir-tab-compact-mockup .sir-favicon { width: 14px; flex: 0 0 14px; text-align: center; }
    #sir-tab-compact-mockup .sir-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #sir-tab-compact-mockup .sir-more {
      flex: 0 0 27px;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      color: var(--sir-muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
    }
    #sir-tab-compact-mockup .sir-more:hover,
    #sir-tab-compact-mockup .sir-more:focus-visible { background: var(--sir-surface); border-color: var(--sir-line); }
    #sir-tab-compact-mockup .sir-menu {
      position: absolute;
      z-index: 2;
      top: 29px;
      right: 0;
      width: 120px;
      padding: 3px;
      border: 1px solid var(--sir-line);
      border-radius: 5px;
      background: var(--sir-surface);
      box-shadow: 0 6px 20px #0002;
    }
    #sir-tab-compact-mockup .sir-menu[hidden] { display: none; }
    #sir-tab-compact-mockup .sir-menu button {
      display: block;
      width: 100%;
      padding: 6px;
      text-align: left;
      color: var(--sir-text);
      background: transparent;
      border: 0;
      font: inherit;
      font-size: 11px;
    }
    #sir-tab-compact-mockup .sir-menu button:hover { background: var(--sir-active); }
    #sir-tab-compact-mockup .sir-panel[data-density="comfortable"] .sir-row { min-height: 39px; }
    #sir-tab-compact-mockup .sir-panel[data-density="comfortable"] .sir-row-main { min-height: 37px; padding: 7px; }
    #sir-tab-compact-mockup .sir-panel[data-density="comfortable"] .sir-tools { margin: 10px 0 13px; }
    @media (pointer: coarse) {
      #sir-tab-compact-mockup .sir-row,
      #sir-tab-compact-mockup .sir-row-main { min-height: 44px !important; }
      #sir-tab-compact-mockup .sir-more { width: 44px; height: 44px; flex-basis: 44px; }
      #sir-tab-compact-mockup .sir-tool { min-height: 44px; }
    }
  </style>
  <section class="sir-panel" data-density="compact" aria-label="Sir Tab narrow panel mockup">
    <div class="sir-top">
      <span class="sir-name">Sir Tab</span>
      <select class="sir-density" aria-label="Panel density">
        <option value="compact">Compact</option>
        <option value="comfortable">Comfortable</option>
      </select>
    </div>
    <input class="sir-search" type="search" placeholder="Search tabs and bookmarks" aria-label="Search tabs and bookmarks">
    <div class="sir-tools" aria-label="Actions">
      <button class="sir-tool" type="button" aria-label="New group"><i data-lucide="layers-2" aria-hidden="true"></i><span>Group</span></button>
      <button class="sir-tool" type="button" aria-label="New bookmark"><i data-lucide="bookmark" aria-hidden="true"></i><span>Save</span></button>
      <button class="sir-tool" type="button" aria-label="Select tabs"><i data-lucide="list-checks" aria-hidden="true"></i><span>Select</span></button>
    </div>
    <div class="sir-divider"></div>
    <div class="sir-heading"><span>Tabs</span><span>3 open</span></div>
    <div class="sir-row active">
      <button class="sir-row-main" type="button"><span class="sir-favicon">◈</span><span class="sir-label">Project board — Sir Tab</span></button>
      <button class="sir-more" type="button" aria-label="Actions for Project board" aria-expanded="false"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
      <div class="sir-menu" hidden><button type="button">Close tab</button><button type="button">Add bookmark</button></div>
    </div>
    <div class="sir-row">
      <button class="sir-row-main" type="button"><span class="sir-favicon">◉</span><span class="sir-label">Chrome extension documentation</span></button>
      <button class="sir-more" type="button" aria-label="Actions for Chrome extension documentation" aria-expanded="false"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
      <div class="sir-menu" hidden><button type="button">Close tab</button><button type="button">Add bookmark</button></div>
    </div>
    <div class="sir-row group">
      <button class="sir-row-main" type="button"><span class="sir-favicon">⌄</span><span class="sir-label">Research</span></button>
      <button class="sir-more" type="button" aria-label="Actions for Research group" aria-expanded="false"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
      <div class="sir-menu" hidden><button type="button">Close group</button><button type="button">Rename group</button></div>
    </div>
    <div class="sir-row nested">
      <button class="sir-row-main" type="button"><span class="sir-favicon">◉</span><span class="sir-label">Brave vertical tabs update</span></button>
      <button class="sir-more" type="button" aria-label="Actions for Brave vertical tabs update" aria-expanded="false"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
      <div class="sir-menu" hidden><button type="button">Close tab</button><button type="button">Add bookmark</button></div>
    </div>
    <div class="sir-divider"></div>
    <div class="sir-heading"><span>Bookmarks</span></div>
    <div class="sir-row">
      <button class="sir-row-main" type="button"><span class="sir-favicon">▸</span><span class="sir-label">Development</span></button>
      <button class="sir-more" type="button" aria-label="Actions for Development bookmarks" aria-expanded="false"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
      <div class="sir-menu" hidden><button type="button">Open folder</button></div>
    </div>
  </section>
  <script>
    (() => {
      const root = document.getElementById('sir-tab-compact-mockup');
      const panel = root.querySelector('.sir-panel');
      const density = root.querySelector('.sir-density');
      const state = { density: 'compact' };
      const render = () => { panel.dataset.density = state.density; density.value = state.density; };
      density.addEventListener('change', () => { state.density = density.value; render(); });
      root.querySelectorAll('.sir-more').forEach(button => {
        button.addEventListener('click', () => {
          const menu = button.nextElementSibling;
          const opening = menu.hidden;
          root.querySelectorAll('.sir-menu').forEach(other => { other.hidden = true; });
          root.querySelectorAll('.sir-more').forEach(other => { other.setAttribute('aria-expanded', 'false'); });
          menu.hidden = !opening;
          button.setAttribute('aria-expanded', String(opening));
        });
      });
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: panel, onChange: render });
        tweak.addSelect(state, 'density', { label: 'Panel density', options: ['compact', 'comfortable'], reference: 'density' });
      }
      render();
    })();
  </script>
</div>
